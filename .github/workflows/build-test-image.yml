name: Build Test Image

on:
  push:
    branches: ['kayphoon_test']
  workflow_dispatch:

permissions:
  packages: write
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build image from source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/aether
          tags: |
            type=raw,value=test
            type=sha,prefix=,format=short
      - name: Create CI Dockerfile with forced clean rebuild
        run: |
          cat > /tmp/patch_df.py << 'PYEOF'
          with open('Dockerfile.app.release-local') as f:
              c = f.read()
          old_cmd = 'cargo build --release --locked -p aether-gateway'
          new_cmd = 'grep -c mcp_reset_at crates/aether-admin/src/provider/quota.rs && cargo clean -p aether-admin && rm -rf target/release/.fingerprint/aether_admin* target/release/deps/libaether_admin* target/release/build/aether_admin* && cargo build --release --locked -p aether-gateway'
          assert old_cmd in c, 'Cannot find cargo build command in Dockerfile'
          c = c.replace(old_cmd, new_cmd)
          with open('Dockerfile.app.ci', 'w') as f:
              f.write(c)
          print('Dockerfile patched successfully')
          PYEOF
          python3 /tmp/patch_df.py
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.app.ci
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          build-args: |
            AETHER_BUILD_VERSION=v0.7.0-test
            AETHER_BUILD_TYPE=release
            NODE_BASE_IMAGE=node:22-slim
            RUST_BASE_IMAGE=rust:1.95.0-slim
